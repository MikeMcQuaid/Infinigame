name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  apple-access:
    name: Check TestFlight signing
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a repository branch for signing checks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Run the signing checks from a branch in this repository to use the Apple credentials.' >&2
          exit 1
      # The signing key is available only to release code already on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            .github/testflight.rb
            .github/macOS.entitlements
            script/testflight
          sparse-checkout-cone-mode: false
      - name: Apply the installer fix to the legacy signing probe
        run: |
          if [[ "$(git hash-object script/testflight)" == c8ea98f11e4a2c65f615e6a1665af834d05df54f ]]; then
            git apply --unidiff-zero <<'PATCH'
          --- a/script/testflight
          +++ b/script/testflight
          @@ -98 +98,8 @@
          -  /usr/libexec/PlistBuddy -c 'Add :installerSigningCertificate string Mac Installer Distribution' "$scratch/export.plist"
          +  installer=$(security find-identity -v -p basic "$keychain" | awk -v team="($team)\"" '
          +    /"3rd Party Mac Developer Installer: / && $NF == team && !found { print $2; found=1 }')
          +  if [[ -z "$installer" ]]; then
          +    echo "APP_STORE_CERTIFICATES has no valid Mac Installer Distribution identity for team $team." >&2
          +    security find-identity -p basic "$keychain" >&2
          +    exit 1
          +  fi
          +  /usr/libexec/PlistBuddy -c "Add :installerSigningCertificate string $installer" "$scratch/export.plist"
          PATCH
          fi
      - name: Create the signing test apps
        id: projects
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          for platform in iOS macOS; do
            if [[ "$platform" == macOS ]]; then
              dir=Build/MacStore project=MacStore target=Infinigame plist=Infinigame/Info.plist
            else
              dir=Build/iOS project=Unity-iPhone target=Unity-iPhone plist=Info.plist
            fi
            mkdir -p "$dir"
            echo 'int main(void) { return 0; }' > "$dir/main.c"
            cat > "$dir/project.yml" <<YAML
          name: $project
          targets:
            $target:
              type: application
              platform: $platform
              sources: [main.c]
              info:
                path: $plist
                properties:
                  CFBundleShortVersionString: "0.2.0"
                  CFBundleVersion: "1"
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.Infinigame
                PROVISIONING_PROFILE_SPECIFIER: \$(INFINIGAME_PROFILE)
              scheme: {}
          YAML
            xcodegen generate --spec "$dir/project.yml"
          done
      - name: Check iOS credentials and export locally
        env:
          TESTFLIGHT_PLATFORM: iOS
          GH_TOKEN: ${{ github.token }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          APP_STORE_CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          APP_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets.INFINIGAME_APP_STORE_IOS_PROFILE }}
        shell: bash
        run: &check-signing |
          ruby -r./.github/testflight.rb -e 'TestFlight.new.next_build_number(1)'
          # Bootstrap PRs against the old writer. Later releases must handle the secret as stored.
          if [[ "$(git rev-parse HEAD:.github/testflight.rb)" == b4d1627240721eeb24454d662ac2b631888f13f2 ]]; then
            APP_STORE_KEY=$(ruby .github/testflight.rb write-key /dev/stdout | openssl pkcs8 -topk8 -nocrypt)
            export APP_STORE_KEY
          fi
          script/testflight --dry-run
      - name: Check macOS credentials and export locally
        if: ${{ !cancelled() && steps.projects.outcome == 'success' }}
        env:
          TESTFLIGHT_PLATFORM: macOS
          GH_TOKEN: ${{ github.token }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          APP_STORE_CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          APP_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets.INFINIGAME_APP_STORE_MACOS_PROFILE }}
        shell: bash
        run: *check-signing
