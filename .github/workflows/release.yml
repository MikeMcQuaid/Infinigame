name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'push' && 'infinigame-release' || format('ci-{0}', github.ref) }}
  queue: ${{ github.event_name == 'push' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

env:
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  TESTFLIGHT_PUBLIC_GROUP: ${{ vars.TESTFLIGHT_PUBLIC_GROUP }}
  TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}

jobs:
  windows:
    name: Windows
    if: &trusted-build github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Unity and native speech
        uses: ./.github/actions/prepare-unity
        with:
          target: StandaloneWindows64
      - name: Compile Windows and Steam Deck
        uses: ./.github/actions/compile-unity
        with:
          target: StandaloneWindows64
          method: Infinigame.Editor.Platforms.CIWindows
          version: ''
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
      - name: Package Windows and Steam Deck
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/package-desktop Windows
      - name: Upload the Windows build
        if: env.PUBLISH == 'true' && steps.package.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Infinigame-Windows
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  apple:
    name: macOS and iOS
    if: *trusted-build
    runs-on: xcode-27
    timeout-minutes: 180
    outputs:
      release-version: ${{ steps.plan-mac.outputs.release-version || steps.plan-ios.outputs.release-version }}
      mac-number: ${{ steps.groups.outcome == 'success' && (steps.upload-mac.outcome == 'success' || steps.plan-mac.outputs.needed == 'false') && steps.plan-mac.outputs.build-number || '' }}
      ios-number: ${{ steps.groups.outcome == 'success' && (steps.upload-ios.outcome == 'success' || steps.plan-ios.outputs.needed == 'false') && steps.plan-ios.outputs.build-number || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the Xcode toolchain and TestFlight tooling
        id: tools
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS device SDK $sdk"
          [[ "${sdk%%.*}" -ge 27 ]] || { echo 'TestFlight requires the iOS 27 SDK or newer.' >&2; exit 1; }
          script/test-testflight
      - name: Check tester groups and release notes
        id: groups
        env:
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ruby .github/testflight.rb check-distribution
      - name: Plan macOS
        id: plan-mac
        if: &after-tools ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: ./.github/actions/plan-testflight
        env:
          TESTFLIGHT_PLATFORM: macOS
        with: &api
          key: ${{ secrets.NOTARIZATION_KEY }}
          key-id: ${{ secrets.NOTARIZATION_KEY_ID }}
          issuer: ${{ secrets.NOTARIZATION_ISSUER_ID }}
      - name: Plan iOS
        id: plan-ios
        if: *after-tools
        uses: ./.github/actions/plan-testflight
        env:
          TESTFLIGHT_PLATFORM: iOS
        with: *api
      - name: Prepare Unity and offline speech for both Apple platforms
        id: unity
        if: >-
          ${{ !cancelled() && ((steps.plan-mac.outcome == 'success' && steps.plan-mac.outputs.needed == 'true') ||
          (steps.plan-ios.outcome == 'success' && steps.plan-ios.outputs.needed == 'true')) }}
        uses: ./.github/actions/prepare-unity
        with:
          target: Apple
      - name: Compile macOS with Unity
        id: compile-mac
        if: ${{ !cancelled() && steps.unity.outcome == 'success' && steps.plan-mac.outcome == 'success' && steps.plan-mac.outputs.needed == 'true' }}
        uses: ./.github/actions/compile-unity
        with:
          target: StandaloneOSX
          method: Infinigame.Editor.Platforms.CIMacTestFlight
          version: ${{ steps.plan-mac.outputs.release-version }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
      - name: Sign and validate macOS with App Store Connect
        id: verify-mac
        if: ${{ !cancelled() && steps.compile-mac.outcome == 'success' }}
        timeout-minutes: 60
        env: &sign-mac
          TESTFLIGHT_PLATFORM: macOS
          RELEASE_VERSION: ${{ steps.plan-mac.outputs.release-version }}
          BUILD_NUMBER: ${{ steps.plan-mac.outputs.build-number }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          APP_STORE_CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          APP_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets.INFINIGAME_APP_STORE_MACOS_PROFILE }}
        run: script/testflight --verify
      - name: Package the archived Mac app for direct download
        id: package
        if: ${{ !cancelled() && steps.verify-mac.outcome != 'skipped' && hashFiles('Build/TestFlight/macOS.xcarchive/Info.plist') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_PLATFORM: macOS
          BUILD_NUMBER: ${{ steps.plan-mac.outputs.build-number }}
          RELEASE_VERSION: ${{ steps.plan-mac.outputs.release-version }}
          APP_STORE_KEY: ${{ env.PUBLISH == 'true' && secrets.NOTARIZATION_KEY || '' }}
          APP_STORE_KEY_ID: ${{ env.PUBLISH == 'true' && secrets.NOTARIZATION_KEY_ID || '' }}
          APP_STORE_ISSUER_ID: ${{ env.PUBLISH == 'true' && secrets.NOTARIZATION_ISSUER_ID || '' }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ env.PUBLISH == 'true' && secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE || '' }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD || '' }}
        run: bash .github/package-desktop macOS Build/TestFlight/macOS.xcarchive/Products/Applications/Infinigame.app
      - name: Upload the Mac download
        id: download-mac
        if: ${{ !cancelled() && env.PUBLISH == 'true' && steps.package.outcome == 'success' && steps.package.outputs.path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Infinigame-macOS
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Switch the shared Unity workspace to iOS
        id: switch
        if: ${{ !cancelled() && steps.unity.outcome == 'success' && steps.plan-ios.outcome == 'success' && steps.plan-ios.outputs.needed == 'true' }}
        run: |
          # Keep the editor, Bee, speech and signed Mac archive. Restore clean sources and a target-specific Library.
          git restore --source=HEAD --staged --worktree -- Assets Packages ProjectSettings
          git clean -fdx -- Assets Packages ProjectSettings Library UserSettings
          rm -rf Build/macOSDerived Build/Packages/macOS Build/TestFlight/export/macOS
      - name: Compile iOS with Unity
        id: compile-ios
        if: ${{ !cancelled() && steps.switch.outcome == 'success' }}
        uses: ./.github/actions/compile-unity
        with:
          target: iOS
          method: Infinigame.Editor.Platforms.CIIOS
          version: ${{ steps.plan-ios.outputs.release-version }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
      - name: Identify the iOS compiler and SDK
        if: ${{ !cancelled() && steps.compile-ios.outcome == 'success' }}
        id: xcode
        shell: bash
        env:
          UNITY_DEPENDENCIES: ${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/packages-lock.json') }}
        run: |
          build=$(xcodebuild -version | awk '/Build version/ {print $3}')
          sdk=$(xcrun --sdk iphoneos --show-sdk-build-version)
          echo "prefix=ios-il2cpp-$RUNNER_ARCH-$build-$sdk-$UNITY_DEPENDENCIES" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache native iOS compiler outputs
        id: cache-ios
        if: ${{ !cancelled() && steps.xcode.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Build/iOSDerived/Build/Intermediates.noindex/ArchiveIntermediates/Unity-iPhone/IntermediateBuildFilesPath/Unity-iPhone.build/Release-iphoneos/artifacts
          key: ${{ steps.xcode.outputs.prefix }}-${{ steps.xcode.outputs.image }}-${{ hashFiles('Build/iOS/Il2CppOutputProject/Source/**') }}
          restore-keys: |
            ${{ steps.xcode.outputs.prefix }}-${{ steps.xcode.outputs.image }}-
            ${{ steps.xcode.outputs.prefix }}
      - name: Sign and validate iOS with App Store Connect
        id: verify-ios
        if: ${{ !cancelled() && steps.cache-ios.outcome == 'success' }}
        timeout-minutes: 60
        env: &sign-ios
          TESTFLIGHT_PLATFORM: iOS
          RELEASE_VERSION: ${{ steps.plan-ios.outputs.release-version }}
          BUILD_NUMBER: ${{ steps.plan-ios.outputs.build-number }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          APP_STORE_CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          APP_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets.INFINIGAME_APP_STORE_IOS_PROFILE }}
        run: script/testflight --verify
      - name: Upload the verified macOS archive
        id: upload-mac
        # Once Apple accepts this archive, a rerun skips compiling the Mac app.
        if: >-
          ${{ !cancelled() && env.PUBLISH == 'true' && steps.groups.outcome == 'success' && steps.verify-mac.outcome == 'success' &&
          (steps.download-mac.outcome == 'success' || steps.package.outputs.exists == 'true') }}
        env: *sign-mac
        run: script/testflight --upload-archive
      - name: Upload the verified iOS archive
        id: upload-ios
        if: ${{ !cancelled() && env.PUBLISH == 'true' && steps.groups.outcome == 'success' && steps.verify-ios.outcome == 'success' }}
        env: *sign-ios
        run: script/testflight --upload-archive

  distribute:
    name: TestFlight
    needs: apple
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
      (needs.apple.outputs.mac-number != '' || needs.apple.outputs.ios-number != '') }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.apple.outputs.release-version }}
      APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
      APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Distribute macOS
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.apple.outputs.mac-number != '' }}
        env:
          TESTFLIGHT_PLATFORM: macOS
          BUILD_NUMBER: ${{ needs.apple.outputs.mac-number }}
        run: ruby .github/testflight.rb public
      - name: Distribute iOS
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.apple.outputs.ios-number != '' }}
        env:
          TESTFLIGHT_PLATFORM: iOS
          BUILD_NUMBER: ${{ needs.apple.outputs.ios-number }}
        run: ruby .github/testflight.rb public
