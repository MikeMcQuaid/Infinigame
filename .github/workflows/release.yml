name: TestFlight

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: infinigame-release
  cancel-in-progress: false
  queue: max

jobs:
  platforms:
    name: Desktop release builds
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    with:
      desktop-only: true
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  testflight:
    needs: platforms
    if: ${{ !cancelled() && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [iOS, macOS]
    name: TestFlight (${{ matrix.platform }})
    env:
      TESTFLIGHT_PLATFORM: ${{ matrix.platform }}
      TESTFLIGHT_ARTIFACT: ${{ matrix.platform == 'macOS' && 'testflight-macos' || 'testflight' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore public TestFlight upload intent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.TESTFLIGHT_ARTIFACT }}-upload-*
          path: tmp
          merge-multiple: true
      - name: Prepare TestFlight upload identity
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: |
          RELEASE_VERSION=$(awk '/^  bundleVersion:/ {print $2}' ProjectSettings/ProjectSettings.asset)
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid Unity bundleVersion' >&2; exit 1; }
          export RELEASE_VERSION
          if [[ -f tmp/testflight-upload.json ]]; then
            BUILD_NUMBER="$(ruby .github/testflight.rb resume-public)"
          else
            BUILD_NUMBER="$(ruby .github/testflight.rb next-build-number)"
            export BUILD_NUMBER
            ruby .github/testflight.rb record-public
            echo 'fresh=true' >>"$GITHUB_OUTPUT"
          fi
          echo "build_number=$BUILD_NUMBER" >>"$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >>"$GITHUB_OUTPUT"
      - name: Save public TestFlight upload intent
        if: steps.prepare.outputs.fresh == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.TESTFLIGHT_ARTIFACT }}-upload-${{ steps.prepare.outputs.build_number }}-v${{ steps.prepare.outputs.release_version }}
          path: tmp/testflight-upload.json
          if-no-files-found: error
          retention-days: 90
      - name: Reconcile public TestFlight upload
        id: plan
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ruby .github/testflight.rb plan-public
      - name: Prepare Unity and native speech
        if: steps.plan.outputs.needed == 'true'
        uses: ./.github/actions/prepare-unity
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.platform == 'macOS' && 'StandaloneOSX' || 'iOS' }}
      - name: Build the ${{ matrix.platform }} Xcode project with Unity
        if: steps.plan.outputs.needed == 'true'
        uses: ./.github/actions/compile-unity
        with:
          target: ${{ matrix.platform == 'macOS' && 'StandaloneOSX' || 'iOS' }}
          method: ${{ matrix.platform == 'macOS' && 'Infinigame.Editor.Platforms.CIMacTestFlight' || 'Infinigame.Editor.Platforms.CIIOS' }}
          version: ${{ steps.prepare.outputs.release_version }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
      - name: Archive and upload to TestFlight
        id: upload
        if: steps.plan.outputs.needed == 'true'
        timeout-minutes: 60
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          APP_STORE_CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          APP_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets[matrix.platform == 'macOS' && 'INFINIGAME_APP_STORE_MACOS_PROFILE' || 'INFINIGAME_APP_STORE_IOS_PROFILE'] }}
        run: script/testflight --external
      - name: Distribute TestFlight build
        env:
          TESTFLIGHT_PUBLIC_GROUP: ${{ vars.TESTFLIGHT_PUBLIC_GROUP }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.release_version }}
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ruby .github/testflight.rb public
  review:
    if: github.event_name == 'schedule'
    name: Retry pending TestFlight distribution (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile uploaded builds with tester groups
        env:
          TESTFLIGHT_PLATFORM: ${{ matrix.platform }}
          TESTFLIGHT_PUBLIC_GROUP: ${{ vars.TESTFLIGHT_PUBLIC_GROUP }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
          GH_TOKEN: ${{ github.token }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ruby .github/testflight.rb retry-distribution
