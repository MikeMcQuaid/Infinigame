name: Platform builds

on:
  workflow_call:
    inputs:
      desktop-only:
        type: boolean
        default: false
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name == 'macOS' && !inputs.desktop-only && 'macOS and iOS' || matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS
            runner: macos-26
            target: StandaloneOSX
            method: Infinigame.Editor.Platforms.CIMac
          - name: Windows
            runner: ubuntu-24.04
            target: StandaloneWindows64
            method: Infinigame.Editor.Platforms.CIWindows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a repository branch for platform builds
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'Run the platform builds from a branch in this repository to use the Unity licence.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test signing and distribution with temporary credentials
        if: matrix.name == 'macOS' && !inputs.desktop-only
        run: script/test-testflight
      - name: Prepare Unity and native speech
        id: prepare
        uses: ./.github/actions/prepare-unity
        with:
          platform: ${{ matrix.name }}
          include-ios: ${{ matrix.name == 'macOS' && !inputs.desktop-only }}
          target: ${{ matrix.target }}
      - name: Compile ${{ matrix.name }}
        uses: ./.github/actions/compile-unity
        with:
          target: ${{ matrix.target }}
          method: ${{ matrix.name == 'macOS' && !inputs.desktop-only && 'Infinigame.Editor.Platforms.CIMacAndTestFlight' || matrix.method }}
          version: ''
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
      - name: Archive the native Mac TestFlight app without signing
        if: matrix.name == 'macOS' && !inputs.desktop-only
        run: |
          xcodebuild -quiet -project Build/MacStore/MacStore.xcodeproj -scheme Infinigame \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$PWD/Build/TestFlight/macOS.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          app=Build/TestFlight/macOS.xcarchive/Products/Applications/Infinigame.app/Contents
          test -x "$app/MacOS/Infinigame"
          [[ "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" == com.mikemcquaid.Infinigame ]]
      - name: Package builds
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          script/package "$PLATFORM"
          if [[ "$PLATFORM" == Windows ]]; then script/package SteamDeck; fi
      - name: Upload playable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Infinigame-${{ matrix.name }}
          path: Build/Infinigame-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload the Steam Deck build
        if: matrix.target == 'StandaloneWindows64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Infinigame-SteamDeck
          path: Build/Infinigame-SteamDeck.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Prepare iOS on the same Mac
        id: prepare-ios
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.name == 'macOS' && !inputs.desktop-only }}
        run: |
          # Unity may rewrite project settings. Start iOS from the same sources and its own Library.
          git restore --source=HEAD --staged --worktree -- .
          git clean -fdx -- Assets Packages ProjectSettings Library UserSettings
          script/build-speech iOS
      - name: Compile iOS
        if: ${{ !cancelled() && steps.prepare-ios.outcome == 'success' }}
        uses: ./.github/actions/compile-unity
        with:
          target: iOS
          method: Infinigame.Editor.Platforms.CIIOS
          version: ''
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          compile-ios: 'true'
