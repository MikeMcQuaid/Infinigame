name: Prepare Unity
description: Restore the editor and build caches and prepare native speech
inputs:
  target:
    description: Apple or StandaloneWindows64
    required: true
runs:
  using: composite
  steps:
    - name: Read the pinned Unity editor revision
      if: runner.os == 'macOS'
      id: editor
      shell: bash
      run: |
        awk '/^m_EditorVersionWithRevision:/ { gsub(/[()]/, "", $3); print "version=" $2; print "revision=" $3 }' \
          ProjectSettings/ProjectVersion.txt >> "$GITHUB_OUTPUT"
    - name: Cache Unity Hub and the editor with both Apple build modules
      if: runner.os == 'macOS'
      id: installation
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /Applications/Unity Hub.app
          /Applications/Unity/Hub/Editor/${{ steps.editor.outputs.version }}
        key: unity-editor-${{ runner.os }}-${{ runner.arch }}-${{ steps.editor.outputs.revision }}-mac-il2cpp-ios
    - name: Install the Unity editor and Apple build modules
      if: runner.os == 'macOS' && steps.installation.outputs.cache-hit != 'true'
      shell: bash
      env:
        EDITOR_VERSION: ${{ steps.editor.outputs.version }}
        EDITOR_REVISION: ${{ steps.editor.outputs.revision }}
      run: |
        hub='/Applications/Unity Hub.app/Contents/MacOS/Unity Hub'
        [[ -x "$hub" ]] || brew install --cask unity-hub
        "$hub" -- --headless install --version "$EDITOR_VERSION" --changeset "$EDITOR_REVISION" \
          --architecture "$(uname -m)" --module mac-il2cpp ios --childModules
    - name: Cache the Unity incremental compiler (Bee)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Unity/cache/bee' || '~/.cache/unity3d/bee' }}
        key: bee-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
        restore-keys: bee-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
    - name: Restore the offline speech library
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Build/Speech
        key: speech-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('ThirdParty/Festival/**', 'script/build-speech', 'script/lib/windows-cc') }}
    - name: Build and test the Apple speech libraries
      if: inputs.target == 'Apple'
      shell: bash
      run: |
        script/test-speech
        script/build-speech iOS
    - name: Build the Windows speech library
      if: inputs.target == 'StandaloneWindows64'
      shell: bash
      run: script/build-speech Windows
