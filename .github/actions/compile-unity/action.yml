name: Compile
description: Build Windows players or Apple Xcode projects with Unity
inputs:
  target:
    description: Unity target
    required: true
  method:
    description: Unity build method
    required: true
  version:
    description: Release version
    required: true
  unity-email:
    description: Unity Personal account
    required: true
  unity-password:
    description: Unity Personal password
    required: true
runs:
  using: composite
  steps:
    - name: Restore the Unity project Library
      id: library
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Library
        key: unity-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ hashFiles('Assets/**', 'ProjectSettings/**', 'STORY.md', 'MISSIONS.md', 'FACTIONS.md', 'COLONIES.md') }}
        restore-keys: unity-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
    - name: Build with Unity
      uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
      env:
        UNITY_EMAIL: ${{ inputs.unity-email }}
        UNITY_PASSWORD: ${{ inputs.unity-password }}
      with:
        cliVersion: v0.1.76
        targetPlatform: ${{ inputs.target }}
        buildMethod: ${{ inputs.method }}
        buildsPath: Build
        buildName: Infinigame
        versioning: ${{ inputs.version != '' && 'Custom' || 'None' }}
        version: ${{ inputs.version }}
    - name: Save the Unity project Library
      if: steps.library.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Library
        key: ${{ steps.library.outputs.cache-primary-key }}
